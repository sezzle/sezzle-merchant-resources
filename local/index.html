<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Without this, mobile/emulated viewports lay out at the default ~980px
         and scale the whole page down to fit, so the app's max-width media
         queries never fire. Mirrors the viewport meta in the app's index.html. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How Sezzle Works — local harness</title>
</head>
<body>
    <main>
        <div id="how-sezzle-works"></div>
        <script>
            const config = {
                merchant_uuid: "fc99cfc7-5772-4b36-826c-f27a2b87a8b7",
                merchantName: "Crow's Capes",
                // language: "fr",
                // countryCode: "CA",
                // numberOfPayments: 4,
                includeInStore: true,
                // isLongTerm: true,
                // LTgroup: "b",
                // theme: "dark",
            }
            const node = document.getElementById("how-sezzle-works");
            const iframe = document.createElement('iframe');
            iframe.src = "http://localhost:3000/index.html";
            // Accessible name for the frame, localized to match the page's hiwTitle.
            const FRAME_TITLES = {
                en: "How Sezzle Works",
                fr: "Comment fonctionne Sezzle",
                es: "Cómo funciona Sezzle",
            };
            iframe.title = FRAME_TITLES[config.language] || FRAME_TITLES.en;
            // Starting height only: the page reports its real height once it renders
            // (and again whenever it changes, e.g. on resize), and the frame is sized to
            // fit so it never scrolls on its own.
            iframe.height = '2000px';
            iframe.scrolling = 'no';
            iframe.width = '100%';
            iframe.style.border = 'none';

            // Function to send config to iframe
            const sendConfig = () => {
                iframe.contentWindow.postMessage({
                    key: "about_sezzle_config",
                    ...config
                }, "*");
            };

            // Listen for ready signal from iframe (handles browsers where onload fires before React mounts)
            window.addEventListener("message", function (event) {
                if (event.data.key === "signal_about_sezzle_ready") {
                    sendConfig();
                }
                // Resize the frame to the page's content height.
                if (event.source === iframe.contentWindow &&
                    event.data.key === "about_sezzle_height" &&
                    event.data.height > 0) {
                    iframe.style.height = event.data.height + 'px';
                }
                // Scroll to a spot in the frame (footnote links): the frame is sized to fit,
                // so it can't scroll itself.
                if (event.source === iframe.contentWindow &&
                    event.data.key === "about_sezzle_scroll_to" &&
                    typeof event.data.top === "number") {
                    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
                    window.scrollTo({
                        top: iframe.getBoundingClientRect().top + window.scrollY + event.data.top,
                        behavior: reduceMotion ? "auto" : "smooth"
                    });
                }
            });

            // Also send on load as fallback for browsers where timing works
            iframe.onload = function () {
                sendConfig();
            };

            node.appendChild(iframe);
        </script>
</main>
</body>
</html>
